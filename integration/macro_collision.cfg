# A [gcode_macro T1] next to [hotendchanger_tool T1] would give the T1
# command two competing definitions, so config load must fail.
[include base.cfg]

[gcode_macro T1]
gcode:
    M117 macro T1

[hotendchanger_tool T0]
extruder: extruder
params_dock_x: 10.0
params_dock_y: 350.0
params_dock_z: 20.0

[hotendchanger_tool T1]
extruder: extruder1
params_dock_x: 90.0
params_dock_y: 350.0
params_dock_z: 20.0
