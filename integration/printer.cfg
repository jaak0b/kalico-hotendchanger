# The working config every passing case runs against. T1 carries nonzero
# gcode offsets so the cases prove the offset actually reaches the gcode
# origin (GET_POSITION's "gcode homing" row) after a change to T1.
[include base.cfg]

[hotendchanger_tool T0]
extruder: extruder
params_dock_x: 10.0
params_dock_y: 350.0
params_dock_z: 20.0

[hotendchanger_tool T1]
extruder: extruder1
gcode_x_offset: 0.4
gcode_y_offset: 0.2
gcode_z_offset: -0.05
params_dock_x: 90.0
params_dock_y: 350.0
params_dock_z: 20.0
