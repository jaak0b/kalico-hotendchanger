# Shared base for the integration test configs. Nothing here describes real
# hardware: the MCU is Kalico's linuxprocess simulation target and the pin
# names are that target's own, so the numbers are placeholders chosen only to
# pass config validation. No detect_pin is configured: the simulated MCU
# reports no button state changes, so detection resolution is covered by the
# unit tests instead. The hotendchanger_tool sections live in the including
# config, so the failure cases can vary them against this same base.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0
position_max: 400
homing_speed: 50

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0
position_max: 400
homing_speed: 50

[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio11
position_endstop: 0
position_max: 300
homing_speed: 10

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio15
sensor_type: Generic 3950
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 300

# No step pins: Kalico's extruder kinematics builds a heater-only extruder
# for a section without them, which is the plugin's T1..Tn configuration.
[extruder1]
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio19
sensor_type: Generic 3950
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 300

[pause_resume]

[hotendchanger]
pickup_gcode:
    G90
    G1 X{params.dock_x} Y{params.dock_y} F6000
    G1 Z{params.dock_z} F600
dropoff_gcode:
    G90
    G1 X{params.dock_x} Y{params.dock_y} F6000
    G1 Z{params.dock_z} F600
before_change_gcode:
    {action_respond_info("hotendchanger before: old=%s new=%s" % (old_tool.name if old_tool else "none", new_tool.name))}
after_change_gcode:
    {action_respond_info("hotendchanger after: old=%s new=%s" % (old_tool.name if old_tool else "none", new_tool.name))}
