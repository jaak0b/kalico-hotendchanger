# Shared base for the hand-written integration test configs: the simulated
# machine plus T1's heater-only extruder section and the plugin section. No
# detect_pin is configured: the simulated MCU reports no button state
# changes, so detection resolution is covered by the unit tests instead. The
# hotendchanger_tool sections live in the including config, so the failure
# cases can vary them against this same base.

[include machine.cfg]

# No step pins: Kalico's extruder kinematics builds a heater-only extruder
# for a section without them, which is the plugin's T1..Tn configuration.
[extruder1]
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio19
sensor_type: Generic 3950
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 300

[hotendchanger]
pickup_gcode:
    G90
    G1 X{params.dock_x} Y{params.dock_y} F6000
    G1 Z{params.dock_z} F600
dropoff_gcode:
    G90
    G1 X{params.dock_x} Y{params.dock_y} F6000
    G1 Z{params.dock_z} F600
before_change_gcode:
    {action_respond_info("hotendchanger before: old=%s new=%s" % (old_tool.name if old_tool else "none", new_tool.name if new_tool else "none"))}
after_change_gcode:
    {action_respond_info("hotendchanger after: old=%s new=%s" % (old_tool.name if old_tool else "none", new_tool.name if new_tool else "none"))}

# The hotendchanger hosts the carrier's ExtruderStepper on the active
# heater-only section, and both firmwares merge that stepper's status
# (including pressure_advance) into the section's status, so these rows
# prove the per-tool pressure advance is live where the planner reads it.
[gcode_macro PA_REPORT]
gcode:
    {action_respond_info("PA extruder=%.6f" % printer.extruder.pressure_advance)}
    {action_respond_info("PA extruder1=%.6f" % printer.extruder1.pressure_advance)}
