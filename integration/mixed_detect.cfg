# detect_pin is all-or-nothing across the tools, so a config setting it on
# only one tool must be rejected at connect.
[include base.cfg]

[hotendchanger_tool T0]
extruder: extruder
params_dock_x: 10.0
params_dock_y: 350.0
params_dock_z: 20.0

[hotendchanger_tool T1]
extruder: extruder1
detect_pin: ^gpio22
params_dock_x: 90.0
params_dock_y: 350.0
params_dock_z: 20.0
